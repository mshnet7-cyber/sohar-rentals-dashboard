<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة عقارات صحار</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="./modern_dashboard.html" title="لوحة عقارات صحار"></iframe><script>(function(){const f=document.getElementById('app');function migrate(){try{const old=JSON.parse(localStorage.getItem('sohar_manual_sites')||'[]');const cur=JSON.parse(localStorage.getItem('sohar_new_sites_v1')||'[]');if(Array.isArray(old)&&old.length){const ids=new Set(cur.map(x=>String(x.id||x['#']||'')));for(const r of old){const id=String(r.id||r['#']||('N'+Date.now()+Math.random()));if(ids.has(id))continue;cur.push({id:id,type:r['النوع']||'موقع جديد',name:r['اسم المعلن']||'',phone:r['رقم التواصل']||'',area:r['المنطقة']||'',price:r['السعر (ر.ع)']||'',period:r.period||'',details:r['التفاصيل']||'',lat:r.lat,lng:r.lng,photo:r.photo||'',createdAt:r['تاريخ الإضافة']||new Date().toISOString()});}try{localStorage.setItem('sohar_new_sites_v1',JSON.stringify(cur))}catch(e){}}}catch(e){}}function patch(){try{const w=f.contentWindow;w.eval("save=function(){try{localStorage.setItem(SITES_KEY,JSON.stringify(sites))}catch(e){try{localStorage.setItem(SITES_KEY,JSON.stringify(sites.map(function(r){var c=Object.assign({},r);c.photo='';return c}))}catch(e2){}}};if(typeof render==='function'){render()}");w.setInterval(function(){try{if(typeof render==='function')render()}catch(e){}},700)}catch(e){}}migrate();f.addEventListener('load',function(){setTimeout(function(){migrate();patch()},500);setTimeout(function(){patch()},2500)});})();</script></body></html>
