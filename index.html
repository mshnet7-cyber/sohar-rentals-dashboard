<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة عقارات صحار</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#07101d;--panel:#101c2e;--line:#263a58;--text:#f4f7fb;--muted:#9eb1c9;--blue:#46a6ff;--green:#34d399}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}body{overflow:hidden}.top{height:74px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 18px;background:rgba(8,17,31,.97);border-bottom:1px solid var(--line);position:relative;z-index:20}.title h1{margin:0;font-size:23px}.title p{margin:4px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:11px;font:inherit;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#2d8fff,#46a6ff);border-color:#4ea9ff;color:#fff;font-weight:700}.board{height:calc(100vh - 74px);position:relative}.board iframe{display:block;width:100%;height:100%;border:0;background:#0b1220}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:94vh;overflow:auto;background:#0d1829;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.sheet h2{margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0b1626;color:var(--text);font:inherit}.photo{display:none;width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-top:8px;border:1px solid var(--line)}.map{height:330px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:8px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.small{color:var(--muted);font-size:12px}.footer-actions{display:flex;gap:9px;margin-top:14px}@media(max-width:700px){.top{height:68px;padding:9px 11px}.title h1{font-size:18px}.title p{font-size:11px}.btn{padding:9px 11px}.board{height:calc(100vh - 68px)}.formgrid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="title"><h1>لوحة عقارات صحار</h1><p>لوحة البحث اليومية + إضافة مواقع جديدة مباشرة</p></div><div class="actions"><button class="btn primary" id="newSite">＋ موقع جديد</button></div></div><div class="board"><iframe id="daily" src="./%D8%AF%D8%A7%D8%B4%D8%A8%D9%88%D8%B1%D8%AF_%D8%B9%D9%82%D8%A7%D8%B1%D8%A7%D8%AA_%D8%B5%D8%AD%D8%A7%D8%B1%20(1).html" title="لوحة البحث اليومية"></iframe></div><div class="modal" id="modal"><div class="sheet"><h2>إضافة موقع جديد</h2><div class="formgrid"><input id="name" class="field full" placeholder="اسم العقار أو اسم المعلن"><input id="phone" class="field" placeholder="رقم الهاتف" inputmode="tel"><input id="type" class="field" value="موقع جديد" placeholder="نوع العقار"><input id="area" class="field" placeholder="المنطقة / الحي"><input id="price" class="field" placeholder="السعر" inputmode="decimal"><select id="period" class="field"><option>شهري</option><option>سنوي</option><option>يومي</option><option>أسبوعي</option></select><textarea id="details" class="field full" rows="3" placeholder="ملاحظات وتفاصيل"></textarea><div class="full"><div class="small">صورة المبنى — الكاميرا أو المعرض</div><input id="photo" class="field" type="file" accept="image/*" capture="environment"><img id="preview" class="photo"></div><div class="full"><div class="small">الموقع — اضغط على الخريطة لتحديد المكان</div><div id="map" class="map"></div><div class="row" style="margin-top:8px"><button class="btn" id="locate">استخدم موقعي الحالي</button><span id="coords" class="small">لم يتم تحديد الموقع</span></div></div></div><div class="footer-actions"><button class="btn primary" id="save">حفظ وإضافة إلى لوحة البحث</button><button class="btn" id="close">إلغاء</button></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const daily=document.getElementById('daily'),modal=document.getElementById('modal'),map=L.map('map').setView([24.35,56.73],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let marker=null,photoData='',manual=[];try{manual=JSON.parse(localStorage.getItem('sohar_manual_sites')||'[]')}catch{manual=[]}const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function sync(){try{const w=daily.contentWindow;if(!Array.isArray(w.rows))return;const ids=new Set(w.rows.map(r=>String(r['#']||r.id||'')));for(const r of manual){if(!ids.has(String(r['#']))){w.rows.push(r)}}if(typeof w.options==='function')w.options();if(typeof w.render==='function')w.render()}catch(e){}}daily.addEventListener('load',()=>{const add=s=>new Promise(r=>{const x=daily.contentDocument.createElement('script');x.src=s;x.onload=r;x.onerror=r;daily.contentDocument.body.appendChild(x)});setTimeout(async()=>{await add('./daily_updates_2026-09-02.js');await add('./daily_ui_fix_2026-09-02.js');await add('./daily_updates_2026-09-03.js');await add('./daily_updates_2026-09-04.js');await add('./status_ui.js');setTimeout(sync,250)},500)});function reset(){['name','phone','area','price','details'].forEach(id=>$(id).value='');$('type').value='موقع جديد';$('period').value='شهري';$('photo').value='';$('preview').style.display='none';$('preview').removeAttribute('src');photoData='';$('coords').textContent='لم يتم تحديد الموقع';if(marker){map.removeLayer(marker);marker=null}}function pick(lat,lng){map.setView([lat,lng],16);if(marker)map.removeLayer(marker);marker=L.marker([lat,lng],{draggable:true}).addTo(map);showCoords();marker.on('dragend',showCoords)}function showCoords(){const x=marker.getLatLng();$('coords').textContent=x.lat.toFixed(6)+', '+x.lng.toFixed(6)}$('map').addEventListener('click',()=>{});map.on('click',e=>pick(e.latlng.lat,e.latlng.lng));$('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>pick(p.coords.latitude,p.coords.longitude),()=>alert('تعذر الحصول على موقع الجهاز'));$('photo').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const max=1200,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.78);$('preview').src=photoData;$('preview').style.display='block'};im.src=rd.result};rd.readAsDataURL(f)};$('newSite').onclick=()=>{reset();modal.classList.add('show');setTimeout(()=>{map.invalidateSize();map.setView([24.35,56.73],11)},100)};$('close').onclick=()=>{modal.classList.remove('show');reset()};$('save').onclick=()=>{if(!marker){alert('حدد الموقع على الخريطة أولاً');return}const ll=marker.getLatLng();const n='N'+Date.now();const r={'#':n,'النوع':$('type').value.trim()||'موقع جديد','اسم المعلن':$('name').value.trim(),'المنطقة':$('area').value.trim(),'التفاصيل':$('details').value.trim(),'السعر (ر.ع)':$('price').value.trim(),'رقم التواصل':$('phone').value.trim(),'المنصة':'إضافة يدوية','رابط الإعلان':'','period':$('period').value,'photo':photoData,'lat':+ll.lat.toFixed(6),'lng':+ll.lng.toFixed(6),'تاريخ الإضافة':new Date().toLocaleDateString('ar-OM')};manual.unshift(r);localStorage.setItem('sohar_manual_sites',JSON.stringify(manual));sync();modal.classList.remove('show');reset();alert('تمت إضافة الموقع إلى لوحة البحث اليومية')};setInterval(sync,1500);</script></body></html>
