<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد عقارات صحار</title><style>body{margin:0;background:#0b1220;color:#edf3fb;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:30px}.spin{width:28px;height:28px;border:3px solid #263653;border-top-color:#46a6ff;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 15px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><div>جاري تحميل داشبورد عقارات صحار…</div></div><script>(async()=>{try{const t=await fetch('./dashboard_payload.txt',{cache:'no-store'}).then(r=>r.text()),b=atob(t.trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const ds=new DecompressionStream('gzip'),out=await new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer(),html=new TextDecoder().decode(out);document.open();document.write(html);document.close()}catch(e){document.querySelector('.box').innerHTML='<h3>تعذر تحميل الداشبورد</h3><p>'+e+'</p>'}})()</script></body></html>
