<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="صحار العقاري"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon.svg"><title>صحار العقاري</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f}iframe{width:100%;height:100%;border:0;display:block}.tools{position:fixed;z-index:999999;left:12px;bottom:12px;display:flex;gap:8px}.tool{border:1px solid #355174;background:#102039;color:#fff;border-radius:12px;padding:10px 13px;font:700 12px Tahoma,Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)}.tool.primary{background:linear-gradient(135deg,#2d83ef,#43a6ff);border-color:#55adff}.hidden{display:none}</style></head><body><iframe src="./sohar_unified_dashboard.html" title="صحار العقاري — لوحة موحدة"></iframe><div class="tools"><button id="install" class="tool primary hidden">＋ تثبيت التطبيق</button><button id="share" class="tool">مشاركة الرابط</button></div><script>let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').classList.remove('hidden')});document.getElementById('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById('install').classList.add('hidden')};document.getElementById('share').onclick=async()=>{const data={title:'صحار العقاري',text:'لوحة CRM العقاري المتكاملة لإعلانات صحار',url:location.href};try{if(navigator.share)await navigator.share(data);else await navigator.clipboard.writeText(location.href)}catch(e){}};if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script></body></html>
