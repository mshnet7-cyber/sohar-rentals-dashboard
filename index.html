<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة عقارات صحار</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="./modern_dashboard.html" title="لوحة عقارات صحار"></iframe><script>(function(){const f=document.getElementById('app');const SITES='sohar_new_sites_v1',OLD='sohar_manual_sites';function migrate(){try{const old=JSON.parse(localStorage.getItem(OLD)||'[]');const cur=JSON.parse(localStorage.getItem(SITES)||'[]');if(Array.isArray(old)&&old.length){const ids=new Set(cur.map(x=>String(x.id||x['#']||'')));for(const r of old){const id=String(r.id||r['#']||('N'+Date.now()+Math.random()));if(ids.has(id))continue;cur.push({id:id,type:r['النوع']||'موقع جديد',name:r['اسم المعلن']||'',phone:r['رقم التواصل']||'',area:r['المنطقة']||'',price:r['السعر (ر.ع)']||'',period:r.period||'',details:r['التفاصيل']||'',lat:r.lat,lng:r.lng,photo:r.photo||'',createdAt:r['تاريخ الإضافة']||new Date().toISOString()})}localStorage.setItem(SITES,JSON.stringify(cur))}}catch(e){}}async function loadLegacyIntoMain(){try{const t=await fetch('./داشبورد_عقارات_صحار%20(1).html',{cache:'no-store'}).then(r=>r.text());const m=t.match(/const\s+rows\s*=\s*(\[[\s\S]*?\]);\s*const\s+stats\s*=/);if(!m)return;const data=JSON.parse(m[1]);const w=f.contentWindow;w.eval('rows='+JSON.stringify(data)+';options();render();')}catch(e){console.error('legacy load failed',e)}}function patchSave(){try{const w=f.contentWindow;w.eval("save=function(){try{localStorage.setItem(SITES_KEY,JSON.stringify(sites))}catch(e){try{const slim=sites.map(function(r){var c=Object.assign({},r);c.photo='';return c});localStorage.setItem(SITES_KEY,JSON.stringify(slim));sites=slim}catch(e2){}}};if(typeof render==='function')render();");w.setInterval(function(){try{if(typeof render==='function')render()}catch(e){}},700)}catch(e){}}migrate();f.addEventListener('load',function(){setTimeout(async function(){migrate();patchSave();await loadLegacyIntoMain();patchSave()},400);setTimeout(async function(){await loadLegacyIntoMain();patchSave()},1800)});setTimeout(async function(){await loadLegacyIntoMain();patchSave()},3500)})();</script></body></html>
