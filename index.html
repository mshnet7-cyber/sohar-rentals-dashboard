nt='إضافة موقع جديد';d.getElementById('saveSite').textContent='حفظ الموقع';d.getElementById('saveSite').removeAttribute('data-universal-edit');w.eval('if(typeof reset===\"function\")reset();options();render();');setTimeout(enhance,30)}function deleteUniversal(id){const w=f.contentWindow,sites=w.eval('sites'),idx=sites.findIndex(q=>String(q.id)===String(id)),name=getRows().find(q=>String(q.id)===String(id))?.name||id;if(!confirm('هل تريد حذف الإعلان «'+name+'»؟'))return;if(idx>=0){sites.splice(idx,1);saveMain()}else{const del=j(D,{});del[String(id)]=true;localStorage.setItem(D,JSON.stringify(del));const over=j(E,{});delete over[String(id)];localStorage.setItem(E,JSON.stringify(over))}w.eval('render();');setTimeout(enhance,30)}function applyOverridesAndDeletes(){const w=f.contentWindow,d=w.document,over=j(E,{}),del=j(D,{});d.querySelectorAll('#tbody tr').forEach(tr=>{const id=String(tr.children[0]?.textContent||'').trim();if(!id||id==='—')return;if(del[id]){tr.remove();return}const ov=over[id];if(ov){if(tr.children[2])tr.children[2].textContent=ov.type||tr.children[2].textContent;if(tr.children[3])tr.children[3].textContent=ov.name||tr.children[3].textContent;if(tr.children[4]){tr.children[4].childNodes[0].nodeValue=(ov.area||'—');const sm=tr.children[4].querySelector('.small');if(sm)sm.textContent=ov.details||''}if(tr.children[5])tr.children[5].textContent=(ov.price??'')+' '+(ov.period||'');if(tr.children[6])tr.children[6].textContent=ov.phone||'—';if(tr.children[7])tr.children[7].textContent=ov.platform||'إضافة يدوية'}})}function enhance(){try{const w=f.contentWindow,d=w.document;if(!d.getElementById('tbody'))return;applyOverridesAndDeletes();const th=d.querySelector('thead tr');if(th&&!th.querySelector('[data-actions-head]')){const h=d.createElement('th');h.dataset.actionsHead='1';h.textContent='إجراءات';th.appendChild(h)}d.querySelectorAll('#tbody tr').forEach(tr=>{if(tr.querySelector('[data-row-actions]'))return;const id=String(tr.children[0]?.textContent||'').tr ></div></div>';d.body.appendChild(z);const im=z.querySelector('img'),mb=z.querySelector('.mfmap');let mm=null;z.querySelector('.mfc').onclick=()=>{z.classList.remove('on');if(mm){mm.remove();mm=null}};z.onclick=e=>{if(e.target===z)z.querySelector('.mfc').click()};d.getElementById('tbody').addEventListener('click',e=>{const pic=e.target.closest('img.thumb');if(pic){if(mm){mm.remove();mm=null}mb.style.display='none';im.style.display='block';im.src=pic.src;z.classList.add('on');return}const bt=e.target.closest('[data-map]');if(bt){let r=getRows().find(q=>String(q.id)===String(bt.dataset.map));if(!r||!r.lat||!r.lng)return;im.style.display='none';mb.style.display='block';z.classList.add('on');setTimeout(()=>{if(mm)mm.remove();mm=w.L.map(mb).setView([r.lat,r.lng],16);w.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mm);w.L.marker([r.lat,r.lng]).addTo(mm)},30)}})}catch(e){console.error('media failed',e)}}function bindSave(){try{const w=f.contentWindow,d=w.document,btn=d.getElementById('saveSite');if(btn.dataset.universalBound)return;btn.dataset.universalBound='1';btn.addEventListener('click',e=>{const id=btn.dataset.universalEdit;if(id){e.preventDefault();e.stopImmediatePropagation();saveUniversal(id)}},true)}catch(e){}}function boot(){try{patchRender();media();bindSave()}catch(e){}setTimeout(()=>{legacy();patchRender();media();bindSave();enhance()},400);setTimeout(()=>{legacy();patchRender();media();bindSave();enhance()},1800);setTimeout(()=>{legacy();patchRender();media();bindSave();enhance()},3500)}migrate();f.addEventListener('load',boot);setTimeout(boot,800)})();</script></body></html>
