ata={title:'صحار العقاري',text:'لوحة CRM العقاري المتكاملة لإعلانات صحار',url};try{if(typeof navigator.share==='function'){await navigator.share(data);return}}catch(e){if(e?.name==='AbortError')return}try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);alert('تم نسخ رابط لوحة صحار العقاري');return}}catch(e){}if(copyFallback(url)){alert('تم نسخ رابط لوحة صحار العقاري');return}try{window.prompt('انسخ رابط لوحة صحار العقاري',url)}catch(e){}};if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script></body></html>
