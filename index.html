<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة عقارات صحار</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="./modern_dashboard.html" title="لوحة عقارات صحار"></iframe><script>(function(){const f=document.getElementById('app'),S='sohar_new_sites_v1',O='sohar_manual_sites',E='sohar_ad_overrides_v1',D='sohar_ad_deleted_v1';function j(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'');return v&&typeof v==='object'?v:d}catch(e){return d}}function migrate(){try{const a=JSON.parse(localStorage.getItem(O)||'[]'),b=JSON.parse(localStorage.getItem(S)||'[]');if(Array.isArray(a)&&a.length){const ids=new Set(b.map(x=>String(x.id||x['#']||'')));for(const r of a){const id=String(r.id||r['#']||('N'+Date.now()+Math.random()));if(ids.has(id))continue;b.push({id:id,type:r['النوع']||'موقع جديد',name:r['اسم المعلن']||'',phone:r['رقم التواصل']||'',area:r['المنطقة']||'',price:r['السعر (ر.ع)']||'',period:r.period||'',details:r['التفاصيل']||'',lat:r.lat,lng:r.lng,photo:r.photo||'',createdAt:r['تاريخ الإضافة']||new Date().toISOString()})}localStorage.setItem(S,JSON.stringify(b))}}catch(e){}}async function legacy(){try{const t=await fetch('./داشبورد_عقارات_صحار%20(1).html',{cache:'no-store'}).then(r=>r.text()),a=t.indexOf('const rows = '),b=t.indexOf(';\nconst stats =',a);if(a<0||b<0)return;const data=JSON.parse(t.slice(a+12,b)),w=f.contentWindow;w.eval('rows='+JSON.stringify(data)+';options();render();')}catch(e){}}function install(){try{const w=f.contentWindow,d=w.document,over=j(E,{}),del=j(D,{});if(!w||!d||!d.getElementById('tbody'))return false;if(!w.__universalActionsInstalled){const baseAll=w.all;w.all=function(){return baseAll().filter(r=>!del[String(r.id||r['#']||'')]).map(r=>{const id=String(r.id||r['#']||'');return over[id]?Object.assign({},r,over[id]):r})};const add=()=>{d.querySelectorAll('#tbody tr').forEach(tr=>{if(tr.querySelector('[data-row-actions]'))return;const id=String(tr.children[0]?.textContent||'').trim();if(!id||id==='—')return;const td=d.createElement('td');td.dataset.rowActions='1';td.innerHTML='<div class="row-actions"><button class="btn icon edit" data-edit="'+w.esc(id)+'" title="تعديل">✎</button><button class="btn icon delete" data-delete="'+w.esc(id)+'" title="حذف">×</button></div>';tr.appendChild(td)})};const tbody=d.getElementById('tbody');tbody.addEventListener('click',e=>{const eb=e.target.closest('[data-edit]'),db=e.target.closest('[data-delete]');if(db){const id=String(db.dataset.delete);if(!confirm('هل تريد حذف هذا الإعلان؟'))return;const idx=w.sites.findIndex(q=>String(q.id)===id);if(idx>=0){w.sites.splice(idx,1);w.save()}else{del[id]=true;delete over[id];localStorage.setItem(D,JSON.stringify(del));localStorage.setItem(E,JSON.stringify(over))}w.render();setTimeout(add,20);return}if(eb){const id=String(eb.dataset.edit),r=w.all().map(w.a).find(q=>String(q.id)===id);if(!r)return;w.editId=id;w.$('modalTitle').textContent='تعديل الإعلان';w.$('saveSite').textContent='حفظ التعديل';w.$('fName').value=r.name||'';w.$('fPhone').value=r.phone||'';w.$('fType').value=r.type||'موقع جديد';w.$('fArea').value=r.area||'';w.$('fPrice').value=r.price??'';const ps=['شهري','سنوي','يومي','أسبوعي'];w.$('fPeriod').value=ps.includes(r.period)?r.period:ps[0];w.$('fDetails').value=r.details||'';w.$('fPhoto').value='';w.$('photoPreview').src=r.photo||'';w.$('photoPreview').style.display=r.photo?'block':'none';if(w.pickMarker)w.pickMap.removeLayer(w.pickMarker);if(r.lat&&r.lng)w.setPick(+r.lat,+r.lng);else{w.pickMarker=null;w.$('coords').textContent='لم يتم تحديد موقع'}w.$('modal').classList.add('show');setTimeout(()=>{if(w.pickMap)w.pickMap.invalidateSize()},100)}});const obs=new MutationObserver(()=>add());obs.observe(tbody,{childList:true,subtree:true});w.__universalActionsInstalled=true;w.__addUniversalActions=add;add();setInterval(add,700)}else if(w.__addUniversalActions)w.__addUniversalActions();return true}catch(e){return false}}function patch(){try{install()}catch(e){}}migrate();f.addEventListener('load',function(){setTimeout(async()=>{patch();await legacy();patch()},300);setTimeout(async()=>{await legacy();patch()},1200);setTimeout(patch,2500);setTimeout(patch,5000)});setTimeout(async()=>{await legacy();patch()},1500)})();</script></body></html>
