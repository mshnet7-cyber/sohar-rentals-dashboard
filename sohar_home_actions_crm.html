<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صحار العقاري — CRM المتكامل</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07111f;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07111f}</style></head><body><iframe id="wrap" src="./sohar_actions_crm.html" title="صحار العقاري — CRM المتكامل"></iframe><script>const w=document.getElementById('wrap');function inject(){try{const inner=w.contentDocument;if(!inner)return;const app=inner.getElementById('f');if(!app||!app.contentDocument)return;const doc=app.contentDocument;const topActions=doc.querySelector('.top .actions');if(!topActions||topActions.querySelector('[data-quick-properties]'))return;const b=doc.createElement('button');b.className='btn';b.setAttribute('data-quick-properties','1');b.textContent='كل الإعلانات';b.style.cssText='background:linear-gradient(135deg,#1769c2,#43a6ff);border-color:#63b4ff;color:#fff;box-shadow:0 6px 18px rgba(67,166,255,.18)';b.title='فتح قائمة جميع الإعلانات';b.onclick=()=>{const nav=doc.querySelector('.nav button[data-view="properties"]');if(nav)nav.click()};topActions.insertBefore(b,topActions.firstChild)}catch(e){}}w.addEventListener('load',()=>{setTimeout(inject,700);setInterval(inject,900)});</script></body></html>
