name: Update dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore dashboard
        env:
          PAYLOAD: 
        run: |
          python - <<'PY2'
          import os,base64,gzip
          data=gzip.decompress(base64.b64decode(os.environ['PAYLOAD']))
          open('index.html','wb').write(data)
          PY2
      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Sohar rental dashboard data and statuses" || exit 0
          git push
