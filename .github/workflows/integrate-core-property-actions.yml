name: Fix core property action handlers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair core HTML handlers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('sohar_modern_crm_v2.html')
          s = p.read_text(encoding='utf-8')

          # The previous core integration accidentally emitted backslash-escaped
          # single quotes inside JavaScript HTML strings. Those make the main
          # script fail to parse. Convert only that escape sequence to HTML quotes.
          s = s.replace("\\\\'", '&quot;')
          p.write_text(s, encoding='utf-8')

          q = Path('index.html')
          x = q.read_text(encoding='utf-8')
          for name in ('location_enhancement.js', 'property_save_fix.js', 'property_actions.js'):
              x = re.sub(r'<script src="\\./' + re.escape(name) + r'\\?v=[^"]+"></script>', '', x)
          x = re.sub(r'v=20260905-\\d+', 'v=20260905-0330', x)
          q.write_text(x, encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          grep -q 'function renderProps' sohar_modern_crm_v2.html
          grep -q 'function detailsProp' sohar_modern_crm_v2.html
          grep -q 'موقعي الحالي' sohar_modern_crm_v2.html
          ! grep -q 'property_actions.js' index.html
          ! grep -q 'location_enhancement.js' index.html
          ! grep -q 'property_save_fix.js' index.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sohar_modern_crm_v2.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix CRM property actions script parsing'
            git push
          fi
