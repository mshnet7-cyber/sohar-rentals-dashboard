name: Fix core property action handlers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix inline property handlers and remove legacy layers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sohar_modern_crm_v2.html')
          s=p.read_text(encoding='utf-8')
          # The previous generated HTML used escaped single quotes inside JS strings.
          # Replace those handlers with data-id based handlers, which are valid in all browsers.
          replacements = {
            'onclick=\\"waProp(\\\\\\\\\''+\'': 'onclick=\\"waProp(this.dataset.id)\\" data-id=\\"',
          }
          # Target exact handler fragments used by the previous integration.
          s=s.replace('onclick=\\"waProp(\\\\\'\'+id+\'\\\\\')\\"', 'onclick=\\"waProp(this.dataset.id)\\" data-id=\\"\'+id+\'\\"')
          s=s.replace('onclick=\\"detailsProp(\\\\\'\'+id+\'\\\\\')\\"', 'onclick=\\"detailsProp(this.dataset.id)\\" data-id=\\"\'+id+\'\\"')
          s=s.replace('onclick=\\"shareProp(\\\\\'\'+id+\'\\\\\')\\"', 'onclick=\\"shareProp(this.dataset.id)\\" data-id=\\"\'+id+\'\\"')
          s=s.replace('onclick=\\"editProp(\\\\\'\'+id+\'\\\\\')\\"', 'onclick=\\"editProp(this.dataset.id)\\" data-id=\\"\'+id+\'\\"')
          s=s.replace('onclick=\\"delProp(\\\\\'\'+id+\'\\\\\')\\"', 'onclick=\\"delProp(this.dataset.id)\\" data-id=\\"\'+id+\'\\"')
          # Details modal uses a.id/a.url rather than id.
          s=s.replace('onclick=\\"waProp(\\\\\'\'+encodeURIComponent(a.id)+\'\\\\\')\\"', 'onclick=\\"waProp(this.dataset.id)\\" data-id=\\"\'+encodeURIComponent(a.id)+\'\\"')
          s=s.replace('onclick=\\"shareProp(\\\\\'\'+encodeURIComponent(a.id)+\'\\\\\')\\"', 'onclick=\\"shareProp(this.dataset.id)\\" data-id=\\"\'+encodeURIComponent(a.id)+\'\\"')
          s=s.replace('onclick=\\"openUrl(\\\\\'\'+encodeURIComponent(a.url)+\'\\\\\')\\"', 'onclick=\\"openUrl(this.dataset.url)\\" data-url=\\"\'+encodeURIComponent(a.url)+\'\\"')
          # URL opening in the table.
          s=s.replace('onclick=\\"openUrl(\\\\\'\'+encodeURIComponent(x.url)+\'\\\\\')\\"', 'onclick=\\"openUrl(this.dataset.url)\\" data-url=\\"\'+encodeURIComponent(x.url)+\'\\"')
          p.write_text(s,encoding='utf-8')

          q=Path('index.html')
          x=q.read_text(encoding='utf-8')
          for name in ('location_enhancement.js','property_save_fix.js','property_actions.js'):
            x=re.sub(r'<script src="\\./'+re.escape(name)+r'\\?v=[^"]+"></script>', '', x)
          x=re.sub(r'v=20260905-\\d+', 'v=20260905-0300', x)
          q.write_text(x,encoding='utf-8')
          PY
      - name: Validate source
        shell: bash
        run: |
          grep -q 'function renderProps' sohar_modern_crm_v2.html
          grep -q 'موقعي الحالي' sohar_modern_crm_v2.html
          grep -q 'waProp(this.dataset.id)' sohar_modern_crm_v2.html
          ! grep -q 'property_actions.js' index.html
          ! grep -q 'location_enhancement.js' index.html
          ! grep -q 'property_save_fix.js' index.html
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sohar_modern_crm_v2.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix property action handlers in CRM core'
            git push
          fi
