name: Repair CRM core

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repair script
        run: python3 scripts/repair_crm.py
      - name: Commit repaired files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sohar_modern_crm_v2.html index.html
          if git diff --cached --quiet; then
            echo 'No repair changes needed'
          else
            git commit -m 'Repair CRM property actions and location controls'
            git push
          fi
