name: Repair CRM core

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run legacy core repair
        run: python3 scripts/repair_crm.py
      - name: Run final navigation repair
        run: python3 scripts/finalize_crm_navigation.py
      - name: Validate embedded JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('sohar_modern_crm_v2.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/sohar_crm.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/sohar_crm.js
      - name: Commit repaired files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sohar_modern_crm_v2.html index.html
          if git diff --cached --quiet; then
            echo 'No repair changes needed'
          else
            git commit -m 'Finalize CRM navigation and property actions'
            git push
          fi
