<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صحار العقاري — CRM المتكامل</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07111f;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07111f}#m{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:16px;z-index:99999;font-family:Tahoma,Arial,sans-serif;color:#f4f7fb}#m.show{display:flex}.sheet{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#0d1929;border:1px solid #223754;border-radius:18px;padding:18px}.sheet h2{margin:0 0 13px}.f{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{width:100%;background:#091625;border:1px solid #223754;border-radius:10px;color:#f4f7fb;padding:10px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #223754;background:#102039;color:#f4f7fb;padding:7px 10px;border-radius:9px;cursor:pointer}.primary{background:linear-gradient(135deg,#2d83ef,#43a6ff);border-color:#55adff}.danger{color:#ffd4da;border-color:#743242;background:#25131a}.toast{position:fixed;bottom:18px;left:18px;background:#10233b;border:1px solid #223754;padding:10px 13px;border-radius:11px;display:none;z-index:100000;font-family:Tahoma,Arial,sans-serif;color:#fff}.toast.show{display:block}@media(max-width:650px){.f{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><iframe id="f" src="./sohar_integrated_crm.html" title="صحار العقاري — CRM المتكامل"></iframe><div id="m"><div class="sheet"><h2>تعديل الإعلان</h2><div class="f"><input id="n" class="field full" placeholder="اسم العقار / المعلن"><input id="p" class="field" placeholder="رقم الهاتف"><input id="t" class="field" placeholder="نوع العقار"><input id="a" class="field" placeholder="المنطقة"><input id="pr" class="field" placeholder="السعر"><select id="pe" class="field"><option>شهري</option><option>سنوي</option><option>يومي</option><option>أسبوعي</option></select><textarea id="d" class="field full" rows="5" placeholder="التفاصيل"></textarea><input id="u" class="field full" placeholder="رابط الإعلان"><input id="ph" class="field full" placeholder="رابط الصورة"></div><div class="actions"><button id="save" class="btn primary">حفظ التعديل</button><button id="cancel" class="btn">إلغاء</button></div></div></div><div id="toast" class="toast"></div><script>const API='https://jwspwefzpsleovjuifxi.supabase.co/functions/v1/sohar-rentals-api',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg4NTA3NTQ4LCJleHAiOjIxMDQwODM1NDl9.2bkzHfmDJcKxVRKm-NHsmuCJg0cFV074BkFF2J9FI-4';const f=document.getElementById('f'),$=x=>document.getElementById(x);let ads=[],editId='';function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}async function load(){const r=await fetch(API,{headers:{apikey:ANON,Authorization:'Bearer '+ANON}});const j=await r.json();ads=j.ads||[]}async function api(action,payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:ANON,Authorization:'Bearer '+ANON},body:JSON.stringify({action,...payload})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'خطأ');return j}function inject(){try{const doc=f.contentDocument,tbody=doc.querySelector('#propRows');if(!tbody)return;if(!tbody.dataset.actionsInit){const tr=doc.querySelector('#propRows')?.closest('table')?.querySelector('thead tr');if(tr&&!tr.querySelector('[data-actions-head]')){const th=doc.createElement('th');th.dataset.actionsHead='1';th.textContent='إجراءات';tr.appendChild(th)}tbody.dataset.actionsInit='1'}tbody.querySelectorAll('tr').forEach(tr=>{if(tr.dataset.editDel)return;const c=tr.cells[0];if(!c)return;const m=(c.textContent||'').match(/#([^\s]+)/);if(!m)return;const id=m[1];const td=doc.createElement('td');td.innerHTML='<div style="display:flex;gap:5px"><button class="btn" data-ed="'+encodeURIComponent(id)+'">تعديل</button><button class="btn danger" data-del="'+encodeURIComponent(id)+'">حذف</button></div>';tr.appendChild(td);tr.dataset.editDel='1'});if(!tbody.dataset.listener){tbody.addEventListener('click',e=>{const eb=e.target.closest('[data-ed]');if(eb){edit(decodeURIComponent(eb.dataset.ed));return}const db=e.target.closest('[data-del]');if(db)del(decodeURIComponent(db.dataset.del))});tbody.dataset.listener='1'}}catch(e){}}async function edit(id){await load();const x=ads.find(a=>String(a.id)===String(id));if(!x){toast('الإعلان غير موجود');return}editId=id;$('n').value=x.name||'';$('p').value=x.phone||'';$('t').value=x.type||'';$('a').value=x.area||'';$('pr').value=x.price||'';$('pe').value=x.period||'شهري';$('d').value=x.details||'';$('u').value=x.url||'';$('ph').value=x.photo||'';$('m').classList.add('show')}async function del(id){if(!confirm('حذف هذا الإعلان؟\nسيتم إخفاؤه من الإعلانات النشطة مع بقاء بياناته في القاعدة.'))return;try{await api('delete',{id});toast('تم حذف الإعلان');setTimeout(()=>f.contentWindow.location.reload(),300)}catch(e){toast(e.message)}}$('cancel').onclick=()=>$('m').classList.remove('show');$('save').onclick=async()=>{try{await api('upsert',{ad:{id:editId,name:$('n').value,phone:$('p').value,type:$('t').value,area:$('a').value,price:$('pr').value,period:$('pe').value,details:$('d').value,url:$('u').value,photo:$('ph').value,active:true}});$('m').classList.remove('show');toast('تم تحديث الإعلان');setTimeout(()=>f.contentWindow.location.reload(),300)}catch(e){toast(e.message)}};f.addEventListener('load',()=>{setTimeout(inject,500);setInterval(inject,800)})</script></body></html>
