<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صحار العقاري — إضافة عقار</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.quickAdd{position:fixed;top:18px;left:18px;z-index:10000;border:1px solid #55adff;background:linear-gradient(135deg,#2d83ef,#43a6ff);color:#fff;padding:12px 16px;border-radius:12px;font:700 13px Tahoma,Arial,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(45,131,239,.3)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;justify-content:center;padding:14px;z-index:99999}.overlay.show{display:flex}.sheet{width:min(900px,97vw);max-height:94vh;overflow:auto;background:#0d1929;border:1px solid #223754;border-radius:18px;padding:18px;color:#f4f7fb;font-family:Tahoma,Arial,sans-serif}.sheet h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.field{width:100%;background:#091625;border:1px solid #223754;border-radius:10px;color:#f4f7fb;padding:10px}.photoBox{border:1px dashed #355174;border-radius:12px;padding:10px}.thumb{max-width:100%;max-height:220px;display:none;margin-top:8px;border-radius:10px;border:1px solid #223754}.map{height:310px;border-radius:12px;overflow:hidden;border:1px solid #223754;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #223754;background:#102039;color:#f4f7fb;padding:9px 13px;border-radius:10px;cursor:pointer}.primary{background:linear-gradient(135deg,#2d83ef,#43a6ff);border-color:#55adff}.muted{color:#8fa4bf;font-size:11px}.toast{position:fixed;bottom:18px;left:18px;background:#10233b;border:1px solid #223754;padding:10px 13px;border-radius:11px;display:none;z-index:100000;font-family:Tahoma,Arial,sans-serif;color:#fff}.toast.show{display:block}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.map{height:260px}.quickAdd{top:10px;left:10px;padding:10px 12px;font-size:12px}}</style></head><body><iframe id="w" src="./sohar_home_actions_crm.html" title="صحار العقاري — CRM المتكامل"></iframe><button id="quickAdd" class="quickAdd">＋ إضافة عقار</button><div id="ov" class="overlay"><div class="sheet"><h2>＋ إضافة عقار جديد</h2><div class="grid"><input id="name" class="field full" placeholder="اسم العقار / اسم المعلن"><input id="phone" class="field" placeholder="رقم الهاتف" inputmode="tel"><input id="type" class="field" placeholder="نوع العقار" value="شقة"><input id="area" class="field" placeholder="المنطقة / الحي"><input id="price" class="field" placeholder="السعر" inputmode="decimal"><select id="period" class="field"><option>شهري</option><option>سنوي</option><option>يومي</option><option>أسبوعي</option></select><textarea id="details" class="field full" rows="4" placeholder="تفاصيل العقار وملاحظات المالك"></textarea><div class="photoBox full"><div class="muted">صورة العقار — الكاميرا أو المعرض</div><input id="photo" class="field" type="file" accept="image/*" capture="environment"><img id="preview" class="thumb"></div><div class="full"><div class="muted">الموقع — اضغط على الخريطة لتحديده أو استخدم موقعك الحالي</div><div id="map" class="map"></div><div class="actions"><button id="locate" class="btn">استخدم موقعي الحالي</button><span id="coords" class="muted">لم يتم تحديد موقع</span></div></div></div><div class="actions"><button id="save" class="btn primary">حفظ العقار</button><button id="close" class="btn">إلغاء</button></div></div></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://jwspwefzpsleovjuifxi.supabase.co/functions/v1/sohar-rentals-api',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg4NTA3NTQ4LCJleHAiOjIxMDQwODM1NDl9.2bkzHfmDJcKxVRKm-NHsmuCJg0cFV074BkFF2J9FI-4';const $=id=>document.getElementById(id);let map,marker,lat=null,lng=null;function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}function initMap(){if(map)return;map=L.map('map').setView([24.3636,56.7343],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);map.on('click',e=>setPoint(e.latlng.lat,e.latlng.lng,true))}function setPoint(a,b,move){lat=Number(a.toFixed(6));lng=Number(b.toFixed(6));if(marker)marker.setLatLng([lat,lng]);else marker=L.marker([lat,lng]).addTo(map);$('coords').textContent='الإحداثيات: '+lat+', '+lng;if(move)map.setView([lat,lng],15)}$('photo').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const u=URL.createObjectURL(f);$('preview').src=u;$('preview').style.display='block'});$('locate').onclick=()=>{if(!navigator.geolocation){toast('الموقع الجغرافي غير متاح');return}navigator.geolocation.getCurrentPosition(p=>setPoint(p.coords.latitude,p.coords.longitude,true),()=>toast('تعذر الحصول على موقعك الحالي'),{enableHighAccuracy:true,timeout:10000})};function open(){ $('ov').classList.add('show');setTimeout(()=>{initMap();map.invalidateSize()},80)}$('quickAdd').onclick=open;$('close').onclick=()=>$('ov').classList.remove('show');async function upload(file,id){const reader=new FileReader();const dataUri=await new Promise((res,rej)=>{reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(file)});const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:ANON,Authorization:'Bearer '+ANON},body:JSON.stringify({action:'upload',id,dataUri,contentType:file.type||'image/jpeg'})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'فشل رفع الصورة');return j.url}async function save(){try{const id='manual-'+Date.now();let photo='';const file=$('photo').files?.[0];if(file)photo=await upload(file,id);const ad={id,name:$('name').value.trim(),phone:$('phone').value.trim(),type:$('type').value.trim()||'عقار',area:$('area').value.trim(),price:$('price').value.trim(),period:$('period').value,details:$('details').value.trim(),photo,lat,lng,platform:'إضافة يدوية',is_manual:true,manual_override:true,active:true};if(!ad.name&&!ad.area&&!ad.phone){toast('أدخل اسم العقار أو المنطقة أو رقم الهاتف');return}const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:ANON,Authorization:'Bearer '+ANON},body:JSON.stringify({action:'upsert',ad})});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'فشل حفظ العقار');$('ov').classList.remove('show');toast('تم حفظ العقار');setTimeout(()=>location.reload(),500)}catch(e){toast(e.message||'حدث خطأ')}}$('save').onclick=save;</script></body></html>
