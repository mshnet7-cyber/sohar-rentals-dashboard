<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>صحار العقاري — CRM Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./sohar_modern_crm_v2.html" title="صحار العقاري — CRM Pro"></iframe><script src="./crm_enhancements.js"></script><script>(function(){const frame=document.getElementById('app');function wire(){try{const d=frame.contentDocument;if(!d||!d.body)return;const map=[['ka','properties'],['ko','owners'],['kn','owners'],['kr','owners'],['kt','renters'],['kp','properties']];map.forEach(([id,view])=>{const n=d.getElementById(id);const card=n&&n.closest('.kpi');if(!card||card.dataset.wired==='1')return;card.dataset.wired='1';card.style.cursor='pointer';card.setAttribute('role','button');card.setAttribute('tabindex','0');card.title='فتح '+(view==='properties'?'العقارات':view==='owners'?'الملاك':'المستأجرين');const go=()=>{const b=d.querySelector('.nav button[data-v="'+view+'"]');if(b)b.click()};card.addEventListener('click',go);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})})}catch(e){}}frame.addEventListener('load',()=>{wire();setInterval(wire,700)});})();</script></body></html>
